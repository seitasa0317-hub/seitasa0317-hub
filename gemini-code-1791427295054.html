<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麺とび六方に行く決断ツール - Windows 95 Edition</title>
  <style>
    /* --------------------------------------------------
       Windows 95 / 平成レトロ スタイル
       -------------------------------------------------- */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: "MS Sans Serif", "MS Gothic", "ＭＳ Ｐゴシック", "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #008080; /* Win95 Teal */
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* デスクトップ領域 */
    #desktop {
      position: relative;
      flex: 1;
      width: 100%;
      height: calc(100vh - 30px);
      overflow: hidden;
    }

    /* デスクトップアイコン */
    .desktop-icon {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 80px;
      text-align: center;
      color: white;
      font-size: 11px;
      cursor: pointer;
    }

    .desktop-icon-img {
      width: 32px;
      height: 32px;
      margin: 0 auto 4px auto;
      background: #c0c0c0;
      border: 2px outset #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000080;
    }

    /* Win95 ウィンドウ基本パーツ */
    .win95-window {
      position: absolute;
      background: #c0c0c0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      box-shadow: 2px 2px 0px #000000;
      padding: 3px;
      min-width: 300px;
      z-index: 10;
    }

    .win95-titlebar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: white;
      padding: 3px 6px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .win95-close-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      font-size: 9px;
      font-weight: bold;
      line-height: 11px;
      text-align: center;
      color: black;
      cursor: pointer;
    }

    .win95-close-btn:active {
      border-color: #808080 #ffffff #ffffff #808080;
      padding: 1px 0 0 1px;
    }

    .win95-body {
      padding: 15px;
      font-size: 12px;
      color: black;
    }

    /* ボタン類 */
    .win95-btn {
      background: #c0c0c0;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      padding: 5px 18px;
      font-size: 12px;
      cursor: pointer;
      min-width: 75px;
      outline: 1px solid black;
      outline-offset: -4px;
    }

    .win95-btn:active {
      border-color: #808080 #ffffff #ffffff #808080;
      padding: 6px 17px 4px 19px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
    }

    /* アイコン＆メッセージ layout */
    .msg-content {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-warning {
      width: 32px;
      height: 32px;
      background: #ffcc00;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: black;
      flex-shrink: 0;
      position: relative;
    }
    .icon-warning::after {
      content: "!";
      position: absolute;
      bottom: 2px;
    }

    .icon-question {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0000ff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      flex-shrink: 0;
    }

    /* タスクバー */
    #taskbar {
      height: 30px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px;
      z-index: 9999;
    }

    .start-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      padding: 2px 6px;
      height: 22px;
      border: 2px solid;
      border-color: #ffffff #808080 #808080 #ffffff;
      background: #c0c0c0;
      font-size: 11px;
      cursor: pointer;
    }

    .start-flag {
      width: 12px;
      height: 12px;
      background: red;
      box-shadow: 2px 2px 0 blue;
    }

    .taskbar-clock {
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      padding: 2px 8px;
      font-size: 11px;
      background: #c0c0c0;
    }

    /* 特別演出：ASCII アート・クリア画面 */
    .ramen-aa {
      font-family: "MS Gothic", monospace;
      font-size: 11px;
      white-space: pre;
      line-height: 1.1;
      background: #000;
      color: #00ff00;
      padding: 10px;
      border: 2px inset #808080;
      overflow-x: auto;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- デスクトップ領域 -->
  <div id="desktop">
    <!-- デスクトップのショートカット -->
    <div class="desktop-icon" onclick="resetApp()">
      <div class="desktop-icon-img">六方</div>
      <div>麺とび六方.exe</div>
    </div>

    <!-- メイン質問ウィンドウ（初期表示） -->
    <div id="main-window" class="win95-window" style="top: 30%; left: 50%; transform: translate(-50%, -50%);">
      <div class="win95-titlebar">
        <span>麺とび六方 決定ツール v1.0</span>
        <div class="win95-close-btn" onclick="triggerNo()">×</div>
      </div>
      <div class="win95-body">
        <div class="msg-content">
          <div class="icon-question">?</div>
          <div>
            <p style="margin: 0; font-weight: bold; font-size: 13px;">麺とび六方に行きますか？？？</p>
            <p style="margin: 5px 0 0 0; color: #555; font-size: 11px;">※極太麺・アブラ・ニンニク・ほぐし豚の誘惑</p>
          </div>
        </div>
        <div class="btn-container">
          <button class="win95-btn" onclick="goRoppou()">はい(Y)</button>
          <button class="win95-btn" onclick="triggerNo()">いいえ(N)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- タスクバー -->
  <div id="taskbar">
    <button class="start-btn" onclick="alert('麺とび六方 各店へ急行せよ！')">
      <div class="start-flag"></div>
      スタート
    </button>
    <div id="clock" class="taskbar-clock">12:00 PM</div>
  </div>

  <script>
    /* --------------------------------------------------
       Web Audio API による Win95風 レトロ効果音
       -------------------------------------------------- */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
    }

    // 警告音（Win95 エラー・警告音風）
    function playWarningSound() {
      initAudio();
      if (!audioCtx) return;
      
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.15);
    }

    // ファンファーレ音（「はい」選択時）
    function playFanfareSound() {
      initAudio();
      if (!audioCtx) return;

      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime + idx * 0.1;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.25);
      });
    }

    /* --------------------------------------------------
       無限ダイアログ（「いいえ」を押した時のロジック）
       -------------------------------------------------- */
    let loopCount = 0;

    function triggerNo() {
      playWarningSound();
      loopCount++;

      createWarningWindow();
    }

    function createWarningWindow() {
      const desktop = document.getElementById('desktop');
      const win = document.createElement('div');
      win.className = 'win95-window';

      const randomX = Math.min(Math.max(10, Math.floor(Math.random() * (window.innerWidth - 320))), window.innerWidth - 330);
      const randomY = Math.min(Math.max(10, Math.floor(Math.random() * (window.innerHeight - 200))), window.innerHeight - 210);

      win.style.left = randomX + 'px';
      win.style.top = randomY + 'px';
      win.style.zIndex = 100 + loopCount;

      const messages = [
        "本当に後悔しませんか？",
        "本当に後悔しませんか？？（全マシの誘惑）",
        "本当に後悔しませんか？？？（あの極太麺ですよ？）",
        "本当に後悔しませんか？？？？（ほぐし豚が泣いています）",
        "本当に後悔しませんか？？？？？（ニンニク入れますか？）",
        `警告 #${loopCount}: 本当に後悔しませんか？？？？？？`
      ];

      const msgText = messages[Math.min(loopCount - 1, messages.length - 1)];

      win.innerHTML = `
        <div class="win95-titlebar">
          <span>警告 - 麺とび六方 (${loopCount}回目)</span>
          <div class="win95-close-btn" onclick="triggerNo(); this.closest('.win95-window').remove();">×</div>
        </div>
        <div class="win95-body">
          <div class="msg-content">
            <div class="icon-warning"></div>
            <div>
              <p style="margin: 0; font-weight: bold; color: #d00000;">${msgText}</p>
              <p style="margin: 5px 0 0 0; font-size: 10px; color: #333;">
                後から「やっぱり六方行けばよかった…」となっても一切責任は負えません。
              </p>
            </div>
          </div>
          <div class="btn-container">
            <button class="win95-btn" style="font-weight:bold; color:blue;" onclick="goRoppou()">はい (後悔するから行く)</button>
            <button class="win95-btn" onclick="triggerNo()">いいえ (後悔しない)</button>
          </div>
        </div>
      `;

      desktop.appendChild(win);
    }

    /* --------------------------------------------------
       「はい（行く）」を押した時の確定演出（点滅なし）
       -------------------------------------------------- */
    function goRoppou() {
      playFanfareSound();

      const desktop = document.getElementById('desktop');
      desktop.innerHTML = `
        <div class="desktop-icon" onclick="resetApp()">
          <div class="desktop-icon-img">六方</div>
          <div>麺とび六方.exe</div>
        </div>

        <div class="win95-window" style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; z-index: 9999;">
          <div class="win95-titlebar">
            <span>【確定】麺とび六方 出撃命令！</span>
            <div class="win95-close-btn" onclick="resetApp()">×</div>
          </div>
          <div class="win95-body" style="text-align: center;">
            <h2 style="color: #d00000; margin: 0 0 10px 0; font-size: 16px;">★ 麺とび六方 行き確定 ★</h2>
            
            <div class="ramen-aa">
    (  )   (   )  (  )
     ) (    ) (    ) (
    (____)(____)(____)
   |                  |
   |  麺 と び 六 方  |
   |  ヤサイ アブラ   |
   |  ニンニク マシ   |
   |__________________|
    \________________/
            </div>

            <p style="font-weight: bold; margin: 10px 0 5px 0; font-size: 13px;">
              ただちに最寄りの「麺とび六方」へ向かってください！
            </p>
            <p style="font-size: 11px; color: #555; margin-bottom: 15px;">
              コール準備: 「ヤサイマシ・アブラマシ・ニンニク普通で！」
            </p>

            <div class="btn-container">
              <a href="https://www.google.com/maps/search/%E2%80%AD%E7%8C%BF%E3%81%A8%E3%81%B3%E5%85%AD%E6%96%B9" target="_blank" style="text-decoration:none;">
                <button class="win95-btn" style="font-weight: bold; background: #ffff00; color: #000;">
                  Google Mapで六方を探す 🗺️
                </button>
              </a>
              <button class="win95-btn" onclick="resetApp()">最初に戻る</button>
            </div>
          </div>
        </div>
      `;
    }

    function resetApp() {
      location.reload();
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
